<div class="add-card-container">

  <h3>Add</h3>

  <form [formGroup]="cardForm" (ngSubmit)="onSubmit()" class="compact-form">
    <div class="form-group">
      <label for="cardHolderName">Name</label>
      <input 
        type="text" 
        id="cardHolderName" 
        formControlName="cardHolderName" 
        class="form-control"
        [class.is-invalid]="cardForm.get('cardHolderName')?.invalid && cardForm.get('cardHolderName')?.touched">
      <div *ngIf="cardForm.get('cardHolderName')?.invalid && cardForm.get('cardHolderName')?.touched" class="invalid-feedback">
        Name is required
      </div>
    </div>

    <div class="form-group">
      <label for="cardNumber">Card number</label>
      <input 
        type="text" 
        id="cardNumber" 
        formControlName="cardNumber" 
        class="form-control"
        placeholder="1234 5678 9012 3456"
        [class.is-invalid]="cardForm.get('cardNumber')?.invalid && cardForm.get('cardNumber')?.touched">
      <div *ngIf="cardForm.get('cardNumber')?.invalid && cardForm.get('cardNumber')?.touched" class="invalid-feedback">
        {{ getCardNumberErrorMessage() }}
      </div>
    </div>

    <div class="form-group">
      <label for="cardLimit">Limit</label>
      <input 
        type="number" 
        id="cardLimit" 
        formControlName="cardLimit" 
        class="form-control"
        step="0.01"
        min="0"
        placeholder="1000.00"
        [class.is-invalid]="cardForm.get('cardLimit')?.invalid && cardForm.get('cardLimit')?.touched">
      <div *ngIf="cardForm.get('cardLimit')?.invalid && cardForm.get('cardLimit')?.touched" class="invalid-feedback">
        <span *ngIf="cardForm.get('cardLimit')?.hasError('required')">Limit is required</span>
        <span *ngIf="cardForm.get('cardLimit')?.hasError('min')">Limit must be greater than 0</span>
        <span *ngIf="cardForm.get('cardLimit')?.hasError('pattern')">Limit must be a valid amount (e.g., 1000.00)</span>
      </div>
    </div>

    <button 
      type="submit" 
      class="btn-add" 
      [disabled]="isSubmitting">
      {{ isSubmitting ? 'Adding...' : 'Add' }}
    </button>
  </form>

  <div *ngIf="successMessage" class="alert alert-success">
    {{ successMessage }}
  </div>
  <div *ngIf="errorMessage" class="alert alert-danger">
    {{ errorMessage }}
  </div>
</div>
